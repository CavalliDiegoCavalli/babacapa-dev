<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP-IN · Scheda evento Prima serata · anteprima</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="event-poster.css">
<style>
  /* gli stessi font dell'app (styles.css): la cartella fonts/ è accanto a design-system/ */
  @font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap;src:url(../fonts/archivo.woff2) format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(../fonts/jetbrains-mono.woff2) format("woff2")}
  body{margin:0;padding:32px;background:var(--sunk);color:var(--ink);font-family:var(--font-body)}
  h1{font-size:var(--fs-24);margin:0 0 8px}
  h2{font-size:var(--fs-15);color:var(--muted);font-weight:700;margin:32px 0 12px}
  .row{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .phone{width:390px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-2)}
  .tab{width:820px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-2)}
  .pc{width:var(--pcw,1440px);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-2)}
  .theme{position:fixed;top:16px;right:16px;z-index:9}
</style>
</head>
<body>
<button class="btn theme" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Tema chiaro/scuro</button>
<h1>Scheda evento · Prima serata</h1>
<p style="color:var(--muted);margin:0">Dati di esempio (giocatori e statistiche inventati). Un solo componente: il layout dipende dalla larghezza del contenitore.</p>

<h2>Mobile · prima della partita · in diretta · finita</h2>
<div class="row"><div class="phone" id="m-pre"></div><div class="phone" id="m-live"></div><div class="phone" id="m-final"></div></div>
<h2>Tablet · prima della partita</h2>
<div class="tab" id="t-pre"></div>
<h2>PC · prima della partita</h2>
<div class="pc" id="d-pre"></div>
<h2>PC · finita</h2>
<div class="pc" id="d-final"></div>

<script src="spin-core.js"></script>
<script src="event-poster.js"></script>
<script>
const L = 'event-poster-samples/';
const T = {
  rossa: { name: 'Squadra Rossa Baskin Bergamo', short: 'Rossa', abbr: 'ROS', kicker: 'Squadra', sub: 'Baskin Bergamo', logo: L + 'rossa.png', color: '#B5121B', altColor: '#F5D300' },
  gialla: { name: 'Squadra Gialla Baskin Bergamo', short: 'Gialla', abbr: 'GIA', kicker: 'Squadra', sub: 'Baskin Bergamo', logo: L + 'gialla.png', color: '#F5CF1F', altColor: '#7B2490' },
  lumezzane: { name: 'Basket Lumezzane', short: 'Lumezzane', abbr: 'LUM', kicker: 'Basket', sub: 'Lumezzane', logo: L + 'lumezzane.png', color: '#1B3563', altColor: '#F0592A' },
  hurricanes: { name: 'Baskin Basket Bagnatica Hurricanes', short: 'Hurricanes', abbr: 'HUR', kicker: 'Bagnatica', sub: 'Baskin Basket', logo: L + 'hurricanes.jpg', color: '#3E9B2F', altColor: '#F28C28' },
  aurora: { name: 'Aurora S.F. Baskin', short: 'Aurora S.F.', abbr: 'AUR', kicker: 'Baskin', sub: 'Baskin', logo: L + 'aurora.jpg', color: '#D0312D', altColor: '#F08A2C' },
  valseriana: { name: 'Valseriana Baskin', short: 'Valseriana', abbr: 'VAL', kicker: 'Baskin', sub: 'Val Seriana', logo: L + 'valseriana.png', color: '#0E2F4F', altColor: '#E2542A' }
};
/* le sei righe richieste, in quest'ordine (SCHEDA-EVENTO-PRIMA-SERATA.md, sezione 5) */
function rows(s) {
  return [
    { label: 'Punti medi a partita', sub: 'tutte le gare', home: s[0][0], away: s[0][1] },
    { label: 'Punti medi a partita', sub: 'campionato', home: s[1][0], away: s[1][1] },
    { label: 'Scontri diretti vinti', home: s[2][0], away: s[2][1] },
    { kind: 'form', label: 'Ultime 3 partite', sub: 'campionato', home: s[3][0], away: s[3][1] },
    { kind: 'player', label: 'Miglior realizzatore', home: s[4][0], away: s[4][1] },
    { kind: 'player', label: 'Miglior realizzatore da 3', home: s[5][0], away: s[5][1] }
  ];
}
const f = (w, score, opp) => ({ w, score, opp });
const p = (name, num, value, unit, sub) => ({ name, num, value, unit, sub });
const E = {
  pre: { state: 'pre', competition: 'Campionato Baskin', round: 'Giornata 5 · Derby', start: '2026-10-24T15:00:00+02:00', venue: { name: 'Palestra comunale', city: 'Bergamo', href: '#' },
    home: T.rossa, away: T.gialla, cta: { label: 'Segui l’evento', href: '#' }, calendarHref: '#',
    statRows: rows([[38.4, 35.1], [39.1, 34.6], [3, 3],
      [[f(true, '41–33', 'Blu'), f(false, '30–36', 'Islanders'), f(true, '44–28', 'ExtraPass')], [f(true, '38–31', 'Imagna'), f(true, '35–34', 'Hurricanes'), f(false, '29–40', 'Valseriana')]],
      [p('Marta Bonfanti', 7, 86, 'punti', '12,3 a partita'), p('Giulia Pesenti', 4, 74, 'punti', '10,6 a partita')],
      [p('Luca Ghisleni', 11, 9, 'canestri da 3'), p('Davide Locatelli', 9, 11, 'canestri da 3')]]) },
  live: { state: 'live', competition: 'Campionato Baskin', round: 'Giornata 5', start: '2026-10-18T16:00:00+02:00', venue: { name: 'Palestra comunale', city: 'Lumezzane' },
    home: T.lumezzane, away: T.hurricanes, score: { home: 22, away: 25 }, live: { period: '2° tempo', clock: '07:12' }, cta: { label: 'Segui il referto live', href: '#' },
    statRows: rows([[37.9, 37.2], [38.5, 36.8], [0, 1],
      [[f(false, '37–42', 'Blu'), f(true, '39–33', 'ExtraPass'), f(false, '34–35', 'Valseriana')], [f(false, '38–45', 'Aurora S.F.'), f(true, '36–29', 'Islanders'), f(false, '34–35', 'Gialla')]],
      [p('Matteo Gatta', 15, 80, 'punti', '11,4 a partita'), p('Anna Belotti', 9, 77, 'punti', '12,8 a partita')],
      [p('Federico Zani', 3, 10, 'canestri da 3'), p('Simone Previtali', 7, 9, 'canestri da 3')]]) },
  final: { state: 'final', competition: 'Torneo d’autunno', round: 'Finale', start: '2026-10-11T17:30:00+02:00', venue: { name: 'Palestra comunale', city: 'Clusone' },
    home: T.valseriana, away: T.aurora, score: { home: 39, away: 35 }, cta: { label: 'Vedi il referto', href: '#' },
    statRows: rows([[36.0, 41.3], [37.2, 42.0], [2, 2],
      [[f(true, '40–29', 'Gialla'), f(true, '37–35', 'ExtraPass'), f(true, '41–38', 'Blu')], [f(true, '45–38', 'Hurricanes'), f(false, '30–39', 'Blu'), f(true, '43–36', 'Imagna')]],
      [p('Elena Carrara', 8, 71, 'punti', '11,8 a partita'), p('Chiara Rinaldi', 6, 92, 'punti', '13,1 a partita')],
      [p('Marco Bonacina', 14, 8, 'canestri da 3'), p('Andrea Ferrari', 12, 13, 'canestri da 3')]]) }
};
const P = SPIN.eventPoster;
P.mount(document.getElementById('m-pre'), E.pre);
P.mount(document.getElementById('m-live'), E.live);
P.mount(document.getElementById('m-final'), E.final);
P.mount(document.getElementById('t-pre'), E.pre);
P.mount(document.getElementById('d-pre'), E.pre);
P.mount(document.getElementById('d-final'), E.final);
</script>
</body>
</html>
